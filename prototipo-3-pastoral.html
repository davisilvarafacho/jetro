<!doctype html>
<!-- Direção "Pastoral": painel de navegação flutuante branco sobre fundo sálvia, Bricolage Grotesque + Figtree, verde-floresta como ação e coral para quem está sem líder; cantos grandes, linhas altas com avatares, formulário em Drawer e login em duas colunas. -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JETRO · Pastoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* base compartilhada: equivale ao que o Mantine entrega por componente; cada protótipo muda só os tokens e o acabamento */
*{box-sizing:border-box}
:root{--demo-space:64px}
html,body{margin:0}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mark{flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* campos */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-weight:600;font-size:var(--lbl-size,.875rem);line-height:1.3}
.req{color:var(--danger)}
.desc{color:var(--muted);font-size:.8125rem;line-height:1.45;max-width:62ch}
.inwrap{position:relative}
.input{display:block;width:100%;height:var(--input-h,40px);padding:0 12px;border:1px solid var(--input-line,var(--line));border-radius:var(--r-sm);background:var(--input-bg,#fff);font-size:var(--input-size,1rem);transition:border-color .12s,box-shadow .12s}
.input::placeholder{color:var(--placeholder,#9a9a9a)}
.input:hover{border-color:var(--input-line-hover,var(--input-line,var(--line)))}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.input[data-mono]{font-family:var(--font-mono);letter-spacing:.01em}
.input.has-left{padding-left:38px}
.input.has-right{padding-right:40px}
.in-left{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.in-right-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);display:grid;place-items:center}
.in-right-btn:hover{background:var(--hover);color:var(--ink)}
.has-error .input{border-color:var(--danger);background:var(--input-bg-err,#fff)}
.has-error .input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.err{color:var(--danger);font-size:.8125rem;line-height:1.4;font-weight:500}
.err:empty{display:none}

/* select pesquisável */
.combo{position:relative}
.combo .input{padding-right:62px}
.combo-chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.combo-clear{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);display:grid;place-items:center}
.combo-clear:hover{background:var(--hover);color:var(--ink)}
.combo:not(.has-val) .combo-clear{display:none}
.combo-list{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;max-height:248px;overflow:auto;margin:0;padding:4px;list-style:none;background:var(--pop-bg,#fff);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 10px 30px -8px rgba(0,0,0,.22)}
.combo-list[hidden]{display:none}
.combo-list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:calc(var(--r-sm) - 1px);cursor:pointer;font-size:var(--opt-size,.9375rem)}
.combo-list li .opt-name{flex:1}
.combo-list li.is-act{background:var(--hover)}
.combo-list li[aria-selected="true"]{font-weight:600;color:var(--primary)}
.combo-list li.empty{cursor:default;color:var(--muted);justify-content:center;padding:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--btn-h,40px);padding:0 var(--btn-px,16px);border-radius:var(--r-btn,var(--r-sm));border:1px solid transparent;font-weight:600;font-size:var(--btn-size,.9375rem);line-height:1;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink,#fff)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:transparent;border-color:var(--btn-line,var(--line));color:var(--ink)}
.btn-outline:hover{background:var(--hover)}
.btn-subtle{background:transparent;color:var(--primary)}
.btn-subtle:hover{background:var(--hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.aicon{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);transition:background .12s,color .12s}
.aicon:hover{background:var(--hover);color:var(--ink)}
.aicon.danger:hover{background:var(--danger-bg);color:var(--danger)}
.aicon .i{width:18px;height:18px}

/* avatar, modal, aviso */
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--av-bg);color:var(--av-ink);font-weight:600;letter-spacing:.02em}
.av-xs{width:22px;height:22px;font-size:.625rem}
.av-sm{width:26px;height:26px;font-size:.6875rem}
.av-md{width:34px;height:34px;font-size:.8125rem}
.av-lg{width:44px;height:44px;font-size:1rem}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--overlay,rgba(20,20,20,.45));animation:fade .15s ease-out}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(100%,var(--modal-w,460px));max-height:calc(100vh - 48px);overflow:auto;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:rise .18s ease-out}
.modal-title{font-family:var(--font-head);font-size:1.25rem;font-weight:var(--head-w,600);line-height:1.25}
.modal-body{margin-top:10px;color:var(--ink-2,var(--ink));line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.toast{position:fixed;top:var(--toast-top,16px);right:16px;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok,#2f9e44);border-radius:var(--r-md);box-shadow:0 10px 30px -8px rgba(0,0,0,.25);font-weight:500;font-size:.9375rem;animation:rise .2s ease-out}
.toast .i{color:var(--ok,#2f9e44);width:18px;height:18px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* barra de telas do protótipo (não faz parte do produto) */
#demo{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:12px;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:calc(100vw - 24px);padding:4px;background:#1b1b1d;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);font:500 12px/1 system-ui,sans-serif}
#demo span{color:#8d8d92;padding:8px 8px 8px 10px;align-self:center}
#demo button{border:0;background:transparent;color:#d4d4d8;padding:8px 10px;border-radius:7px;font:inherit}
#demo button:hover{background:#34343a}
#demo button[aria-current]{background:#f4f4f5;color:#111}

:root{
 --font-body:'Figtree',system-ui,sans-serif;--font-head:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--font-mono:ui-monospace,monospace;
 --bg:#ECF1EA;--surface:#fff;--ink:#1A2A24;--ink-2:#35453F;--muted:#5C6C65;--line:#DCE4DC;--hover:#EAF1EB;
 --primary:#21594A;--primary-hover:#194536;--focus:#21594A;--danger:#C42D3A;--danger-bg:#FDECEE;
 --flag:#C9472A;--flag-bg:#FDEBE4;--flag-ink:#9A331C;--ok:#21594A;
 --r-sm:12px;--r-md:16px;--r-lg:22px;--r-btn:999px;--input-h:48px;--btn-h:46px;--btn-px:22px;--btn-size:1rem;--input-size:1rem;--opt-size:1rem;--lbl-size:.9375rem;
 --input-line:#C5D1C8;--input-line-hover:#9FB1A5;--placeholder:#8A9A92;--av-bg:#D9E8DE;--av-ink:#1D4A3C;--head-w:600;--toast-top:20px;--overlay:rgba(20,38,31,.45);--modal-w:520px;--btn-line:#C5D1C8
}
body{font-size:16px}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);gap:20px;padding:16px;min-height:100vh}
.side{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:22px 16px 18px;background:#fff;border-radius:var(--r-lg);box-shadow:0 1px 0 rgba(26,42,36,.04)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand .mk{width:40px;height:40px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand .mark{width:24px;height:24px}
.brand b{font-family:var(--font-head);font-weight:700;font-size:1.375rem;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:34px}
.nav a{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .12s}
.nav a .i{width:21px;height:21px;color:var(--muted)}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:#DFEDE4;color:var(--primary);font-weight:600}
.nav a[aria-current="page"] .i{color:var(--primary)}
.me{margin-top:auto;padding:16px;background:#F3F7F3;border-radius:18px;display:grid;gap:14px}
.me .p{display:flex;align-items:center;gap:12px}
.me b{display:block;font-weight:600;line-height:1.2}
.me small{color:var(--muted);font-size:.875rem}
.me .btn{height:40px;width:100%;font-size:.9375rem}
.main{min-width:0;padding:20px 24px 120px 8px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
h1{font-family:var(--font-head);font-weight:600;font-size:2.5rem;line-height:1.05;letter-spacing:-.025em}
.sub{margin-top:10px;color:var(--muted);font-size:1.0625rem}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.search{width:340px}
.search .input{border-radius:999px;padding-left:44px;background:#fff}
.search .in-left{left:16px}
.chips{display:flex;gap:8px;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:999px;font-weight:600;font-size:.9375rem;color:var(--ink-2);transition:background .12s,border-color .12s}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip small{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:11px;background:rgba(26,42,36,.08);font-size:.8125rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] small{background:rgba(255,255,255,.2)}
.chip.coral small{background:var(--flag);color:#fff}
.card{background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 1px 0 rgba(26,42,36,.04)}
.tbl th{padding:16px 20px;font-size:.875rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 20px;height:72px;border-bottom:1px solid #EDF1ED;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:not(.is-unled):hover td{background:#F8FAF8}
.who{display:flex;align-items:center;gap:14px}
.who .t b{display:block;font-weight:600;font-size:1.0625rem;line-height:1.25}
.who .t small{display:block;color:var(--muted);font-size:.875rem;margin-top:1px}
.tbl .cpf{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 4px;border-radius:999px;background:#F0F5F1;font-weight:500;font-size:.9375rem;white-space:nowrap}
.dash{color:#9AAAA2}
.tbl tr.is-unled td{background:var(--flag-bg);border-bottom-color:#F7D9CD}
.tbl tr.is-unled .av{--av-bg:#F8CDBE;--av-ink:#8A2C16}
.tbl tr.is-unled:hover td{background:#FBE2D8}
.flagc{display:flex;align-items:center;gap:6px}
.flag{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 11px;border-radius:999px;background:var(--flag);color:#fff;font-weight:600;font-size:.9375rem;white-space:nowrap}
.flag .i{width:16px;height:16px}
.pick{height:34px;padding:0 12px;font-size:.9375rem;color:var(--flag-ink)}
.pick:hover{background:rgba(226,89,58,.14)}
.tbl .acts{text-align:right;white-space:nowrap;width:1%}
.aicon{width:38px;height:38px;border-radius:12px}
.empty-row{padding:56px;text-align:center;color:var(--muted)}
.minic{width:40px;height:40px;border-radius:13px;background:#E3EEE6;color:var(--primary);display:grid;place-items:center;flex:none}
.minic .i{width:20px;height:20px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lpanel{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:40px 56px;background:#1D4A3D;color:#fff;overflow:hidden}
.lpanel .brand .mk{background:#fff;color:var(--primary)}
.lpanel .brand b{color:#fff}
.tiers{width:100%;max-width:560px;height:auto;align-self:center}
.lverse{font-family:var(--font-head);font-weight:500;font-size:1.75rem;line-height:1.25;letter-spacing:-.01em;max-width:30ch}
.lverse cite{display:block;margin-top:14px;font-family:var(--font-body);font-style:normal;font-weight:500;font-size:.9375rem;color:#A9CBBB}
.lright{display:grid;place-items:center;padding:40px 24px 96px;background:var(--bg)}
.lform{width:100%;max-width:392px;display:grid;gap:20px}
.lform h1{font-size:2.25rem}
.lform .lead{margin-top:-6px;color:var(--muted)}
.lform .btn{height:52px;width:100%;font-size:1.0625rem}
.alert{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--danger-bg);color:#8E1F2B;font-weight:600}
.alert .i{width:22px;height:22px}
.input{border-radius:var(--r-sm)}
/* drawer */
.overlay.drawer{place-items:stretch end;padding:0}
.dpanel{display:flex;flex-direction:column;width:min(100%,520px);height:100vh;background:#fff;border-radius:var(--r-lg) 0 0 var(--r-lg);box-shadow:-24px 0 60px -20px rgba(0,0,0,.3);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:28px 28px 20px}
.dhead h2{font-family:var(--font-head);font-weight:600;font-size:1.75rem;letter-spacing:-.02em;line-height:1.1}
.dhead p{margin-top:6px;color:var(--muted)}
.dbody{flex:1;overflow:auto;padding:4px 28px 28px;display:grid;align-content:start;gap:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.group{display:grid;gap:20px;padding:20px;border-radius:var(--r-md);background:#F4F8F4}
.group h3{font-family:var(--font-head);font-weight:600;font-size:1.0625rem}
.group .input{background:#fff}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:18px 28px calc(18px + var(--demo-space));border-top:1px solid var(--line)}
/* modal bloqueio */
.modal.block{--modal-w:540px;padding:32px;border-radius:var(--r-lg)}
.block-ic{width:56px;height:56px;border-radius:50%;background:var(--flag-bg);color:var(--flag);display:grid;place-items:center;margin-bottom:18px}
.block-ic .i{width:28px;height:28px}
.modal-title{font-size:1.625rem;letter-spacing:-.02em}
.modal-body{font-size:1.0625rem;line-height:1.55}
.deps{display:grid;gap:14px;margin-top:22px;padding:18px;border-radius:var(--r-md);background:#F4F8F4}
.deps h3{font-size:.875rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.deps .cl{display:flex;flex-wrap:wrap;gap:8px}
.deps button.pill{border:1px solid var(--line);background:#fff;transition:background .12s,border-color .12s}
.deps button.pill:hover{background:var(--hover);border-color:#B9C9BE}
.deps button.pill.min{padding-left:14px}
.deps .hint{font-size:.875rem;color:var(--muted)}
@media (max-width:1100px){
 .shell{grid-template-columns:80px minmax(0,1fr);gap:14px;padding:12px}
 .side{padding:18px 10px;align-items:center}
 .brand{padding:0}.brand b,.txt,.me .pt{display:none}
 .nav a{width:52px;justify-content:center;padding:0}
 .me{padding:10px;background:transparent}.me .btn{width:44px;height:44px;padding:0}
 .search{width:270px}.lpanel{padding:32px}.lverse{font-size:1.5rem}.main{padding:12px 12px 120px 4px}
 h1{font-size:2.125rem}
 .tbl td,.tbl th{padding-left:14px;padding-right:14px}
 .pill{white-space:normal;line-height:1.2;min-height:34px;height:auto;padding:4px 12px 4px 4px}
 .pick{display:none}
}

const cmp=(a,b)=>nome(a).localeCompare(nome(b),'pt-BR');
const maskCpf=v=>String(v).replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
function cpfOk(v){const d=String(v).replace(/\D/g,'');if(d.length!==11||/^(\d)\1+$/.test(d))return false;
 for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=d[i]*(t+1-i);if((s*10)%11%10!=d[t])return false}return true}
const listPt=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];
const deps=id=>({lidera:MEMBROS.filter(m=>m.lider===id).sort(cmp),parca:MEMBROS.filter(m=>m.parca===id).sort(cmp),min:MINISTERIOS.filter(n=>n.lider===id)});
const hasDeps=d=>d.lidera.length+d.parca.length+d.min.length>0;
function blockedMsg(m){const d=deps(m.id),p=[];
 if(d.lidera.length)p.push('líder de '+listPt(d.lidera.map(nome)));
 if(d.parca.length)p.push('parça de '+listPt(d.parca.map(nome)));
 if(d.min.length)p.push((d.min.length>1?'líder dos ministérios ':'líder do ministério ')+listPt(d.min.map(x=>x.nome)));
 return 'Não é possível excluir '+nome(m)+': '+(FEM.has(m.id)?'ela':'ele')+' é '+listPt(p)+'. Troque esses vínculos antes de excluir.'}
const nLed=m=>MEMBROS.filter(x=>x.lider===m.id).length;
const unled=()=>MEMBROS.filter(m=>!m.lider);

/* ===== estado ===== */
const S={screen:'login',login:{email:'debora@exemplo.com.br',senha:'senhasegura',show:false,error:false},q:'',onlyUnled:false,form:null,min:null,modal:null,toast:null,focus:null};
let CFG={};

function newForm(id){const m=id?byId(id):null;
 S.form={id:id||null,cpf:m?maskCpf(m.cpf):'',nome:m?m.nome:'',sobrenome:m?m.sobrenome:'',lider:m?m.lider:null,parca:m?m.parca:null,errors:{}};S.screen='membro'}
function newMin(id){const n=id?MINISTERIOS.find(x=>x.id===id):null;
 S.min={id:id||null,nome:n?n.nome:'',lider:n?n.lider:null,errors:{}};S.screen='ministerio'}
function validateMember(f){const e={},d=f.cpf.replace(/\D/g,'');
 if(!d)e.cpf='Informe o CPF';
 else if(!cpfOk(d))e.cpf='CPF inválido';
 else if(MEMBROS.some(m=>m.cpf===d&&m.id!==f.id))e.cpf='Este CPF já está cadastrado';
 if(!f.nome.trim())e.nome='Informe o nome';
 if(!f.sobrenome.trim())e.sobrenome='Informe o sobrenome';
 if(f.id&&f.lider===f.id)e.lider='Um membro não pode ser líder de si mesmo';
 if(f.id&&f.parca===f.id)e.parca='Um membro não pode ser parça de si mesmo';
 return e}
function validateMin(f){const e={};
 if(!f.nome.trim())e.nome='Informe o nome do ministério';
 if(!f.lider)e.lider='Escolha o líder do ministério';
 return e}

function demo(k){S.modal=null;S.toast=null;
 if(k==='login'){S.screen='login';S.login.error=false}
 else if(k==='login-erro'){S.screen='login';S.login.error=true;S.login.senha='senhaerrada'}
 else if(k==='membros'){S.screen='membros';S.q='';S.onlyUnled=false}
 else if(k==='novo'){newForm()}
 else if(k==='erros'){newForm();Object.assign(S.form,{cpf:'123.456.789-00',nome:'Gabriel',sobrenome:''});S.form.errors=validateMember(S.form)}
 else if(k==='conflito'){newForm('m2');S.form.cpf=maskCpf(byId('m4').cpf);S.form.lider='m2';S.form.errors=validateMember(S.form)}
 else if(k==='bloqueado'){S.screen='membros';S.q='';S.onlyUnled=false;S.modal={type:'blocked',id:'m2'}}
 else if(k==='ministerios'){S.screen='ministerios'}
 else if(k==='novo-min'){newMin()}
 render()}
const DEMOS=[['login','Login'],['login-erro','Login com erro'],['membros','Membros'],['novo','Novo membro'],['erros','Campos inválidos'],['conflito','CPF repetido e líder'],['bloqueado','Exclusão bloqueada'],['ministerios','Ministérios'],['novo-min','Novo ministério']];
function demoKey(){const s=S.screen;
 if(s==='login')return S.login.error?'login-erro':'login';
 if(s==='membros')return S.modal&&S.modal.type==='blocked'?'bloqueado':'membros';
 if(s==='membro'){const e=Object.keys(S.form.errors).length;return S.form.id?(e?'conflito':'membros'):(e?'erros':'novo')}
 if(s==='ministerios')return 'ministerios';
 return 'novo-min'}
function renderDemo(){const k=demoKey();
 $('#demo').innerHTML='<span>Telas</span>'+DEMOS.map(d=>`<button type="button" data-act="demo" data-k="${d[0]}"${d[0]===k?' aria-current="true"':''}>${d[1]}</button>`).join('')}

/* ===== listas ===== */
function treeOrder(){const out=[];
 const kids=id=>MEMBROS.filter(m=>m.lider===id).sort(cmp);
 const size=m=>1+kids(m.id).reduce((a,k)=>a+size(k),0);
 const walk=(m,d)=>{out.push({m,d});kids(m.id).forEach(k=>walk(k,d+1))};
 MEMBROS.filter(m=>!m.lider).sort((a,b)=>size(b)-size(a)||cmp(a,b)).forEach(r=>walk(r,0));return out}
function visible(){let items=CFG.tree?treeOrder():MEMBROS.slice().sort(cmp).map(m=>({m,d:0}));
 const q=norm(S.q).trim(),qd=S.q.replace(/\D/g,'');
 if(S.onlyUnled)items=items.filter(i=>!i.m.lider);
 if(q)items=items.filter(i=>norm(nome(i.m)).includes(q)||(qd&&i.m.cpf.includes(qd)));
 return items}
function refreshList(){const t=$('#tbl');if(t)t.innerHTML=CFG.table(visible())}

/* ===== campos (equivalentes a TextInput, PasswordInput e Select pesquisável do Mantine) ===== */
const F={
 text(o){const err=o.error||'';
  return `<div class="field${err||o.invalid?' has-error':''}" data-field="${o.f}">
   <label class="lbl" for="f-${o.f}">${o.label}${o.required?' <span class="req" aria-hidden="true">*</span>':''}</label>
   ${o.desc?`<p class="desc" id="d-${o.f}">${o.desc}</p>`:''}
   <div class="inwrap">${o.left?`<span class="in-left">${icon(o.left,18)}</span>`:''}<input class="input${o.left?' has-left':''}" id="f-${o.f}" name="${o.f}" data-scope="${o.scope}" data-f="${o.f}" type="${o.type||'text'}" value="${esc(o.value)}" placeholder="${esc(o.ph||'')}" autocomplete="${o.ac||'off'}"${o.inputmode?` inputmode="${o.inputmode}"`:''}${o.mono?' data-mono':''}${err||o.invalid?' aria-invalid="true"':''}></div>
   <p class="err" id="e-${o.f}">${esc(err)}</p></div>`},
 pw(o){return `<div class="field${o.invalid?' has-error':''}" data-field="senha">
   <label class="lbl" for="f-senha">Senha</label>
   <div class="inwrap"><span class="in-left">${icon('lock',18)}</span><input class="input has-left has-right" id="f-senha" name="senha" data-scope="login" data-f="senha" type="${S.login.show?'text':'password'}" value="${esc(S.login.senha)}" autocomplete="current-password"${o.invalid?' aria-invalid="true"':''}>
   <button type="button" class="in-right-btn" data-act="toggle-pw" aria-label="${S.login.show?'Ocultar senha':'Mostrar senha'}">${icon(S.login.show?'eyeoff':'eye',18)}</button></div></div>`},
 combo(o){const sel=o.value?byId(o.value):null,err=o.error||'';
  return `<div class="field${err?' has-error':''}" data-field="${o.f}">
   <label class="lbl" for="f-${o.f}">${o.label}${o.required?' <span class="req" aria-hidden="true">*</span>':''}</label>
   ${o.desc?`<p class="desc" id="d-${o.f}">${o.desc}</p>`:''}
   <div class="combo${sel?' has-val':''}" data-combo="${o.f}" data-scope="${o.scope}">
    <input class="input" id="f-${o.f}" role="combobox" aria-expanded="false" aria-controls="l-${o.f}" aria-autocomplete="list" autocomplete="off" value="${esc(nome(sel))}" placeholder="${esc(o.ph||'Buscar por nome')}"${err?' aria-invalid="true"':''}>
    <button type="button" class="combo-clear" data-act="combo-clear" tabindex="-1" aria-label="Limpar seleção">${icon('x',16)}</button>
    <span class="combo-chev">${icon('chev',18)}</span>
    <ul class="combo-list" id="l-${o.f}" role="listbox" hidden></ul>
   </div>
   <p class="err" id="e-${o.f}">${esc(err)}</p></div>`},
 av(m,c){return m?`<span class="av ${c||''}" aria-hidden="true">${ini(m)}</span>`:''}
};
function setErr(f,msg){const w=$(`[data-field="${f}"]`);if(!w)return;
 w.classList.toggle('has-error',!!msg);const e=$('.err',w);if(e)e.textContent=msg||'';
 const i=$('.input',w);if(i){if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}}
const scopeObj=s=>s==='form'?S.form:s==='min'?S.min:S.login;

/* ===== combo: abrir, filtrar, escolher ===== */
function optionsHtml(c,q){const f=c.dataset.combo,sel=scopeObj(c.dataset.scope)[f];const nq=norm(q||'');
 const items=MEMBROS.slice().sort(cmp).filter(m=>!nq||norm(nome(m)).includes(nq));
 return items.length?items.map(m=>`<li role="option" id="o-${f}-${m.id}" data-id="${m.id}" aria-selected="${m.id===sel}">${F.av(m,'av-sm')}<span class="opt-name">${esc(nome(m))}</span>${m.id===sel?icon('check',16):''}</li>`).join(''):'<li class="empty" aria-disabled="true">Nenhum membro encontrado</li>'}
function openCombo(c,q){const l=$('.combo-list',c),i=$('.input',c);l.innerHTML=optionsHtml(c,q);l.hidden=false;i.setAttribute('aria-expanded','true');
 const o=$$('li[data-id]',l);let a=o.find(x=>x.getAttribute('aria-selected')==='true')||o[0];setActive(c,a)}
function closeCombo(c){const l=$('.combo-list',c),i=$('.input',c);l.hidden=true;i.setAttribute('aria-expanded','false');i.removeAttribute('aria-activedescendant');
 const id=scopeObj(c.dataset.scope)[c.dataset.combo];i.value=id?nome(byId(id)):''}
function setActive(c,li){$$('li.is-act',c).forEach(x=>x.classList.remove('is-act'));if(!li)return;li.classList.add('is-act');
 $('.input',c).setAttribute('aria-activedescendant',li.id);li.scrollIntoView({block:'nearest'})}
function pick(c,id){const f=c.dataset.combo,sc=c.dataset.scope,o=scopeObj(sc);o[f]=id||null;c.classList.toggle('has-val',!!id);
 $('.input',c).value=id?nome(byId(id)):'';closeCombo(c);
 let msg='';if(sc==='form'&&id&&id===S.form.id)msg=f==='lider'?'Um membro não pode ser líder de si mesmo':'Um membro não pode ser parça de si mesmo';
 if(msg)o.errors[f]=msg;else delete o.errors[f];setErr(f,msg)}

/* ===== modais e avisos ===== */
function confirmHtml(o){return `<div class="overlay" data-act="close-modal" data-bg><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mb">
  <h2 class="modal-title" id="mt">${o.title}</h2><p class="modal-body" id="mb">${o.body}</p>
  <div class="modal-actions"><button type="button" class="btn btn-outline" data-act="close-modal">Cancelar</button><button type="button" class="btn btn-danger" data-act="confirm-del" data-autofocus>${icon('trash',16)}Excluir</button></div></div></div>`}
function modalHtml(){const m=S.modal;if(!m)return '';
 if(m.type==='blocked'){if(!CFG.blockedModal)return '';const x=byId(m.id);return CFG.blockedModal(x,deps(x.id),blockedMsg(x))}
 if(m.type==='confirm-m'){const x=byId(m.id);return confirmHtml({title:'Excluir '+esc(nome(x))+'?',body:'O cadastro será removido da lista de membros. Essa ação não pode ser desfeita.'})}
 if(m.type==='confirm-n'){const x=MINISTERIOS.find(n=>n.id===m.id);return confirmHtml({title:'Excluir o ministério '+esc(x.nome)+'?',body:'O ministério será removido. Os membros continuam cadastrados.'})}
 return ''}
function toastHtml(){const t=S.toast;return t?`<div class="toast" role="status">${icon('check',18)}<span>${esc(t)}</span></div>`:''}
let toastTimer;
function toast(msg){S.toast=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast=null;const t=$('.toast');if(t)t.remove()},3600)}

/* ===== render ===== */
function screenHtml(){const s=S.screen;
 if(s==='membros')return CFG.membros();
 if(s==='membro')return CFG.membro();
 if(s==='ministerios')return CFG.ministerios();
 return CFG.ministerio()}
function render(){const root=$('#app');
 const body=S.screen==='login'?CFG.login():CFG.shell(screenHtml(),S.screen==='membro'||S.screen==='membros'?'membros':'ministerios');
 root.innerHTML=body+modalHtml()+toastHtml();renderDemo();
 const first=$('[data-autofocus]');if(S.modal&&first)first.focus();
 else if(S.focus){const e=$('#f-'+S.focus);if(e)e.focus();S.focus=null}}

/* ===== ações ===== */
function saveMember(){const f=S.form;f.errors=validateMember(f);
 if(Object.keys(f.errors).length){S.focus=Object.keys(f.errors)[0];render();return}
 const d=f.cpf.replace(/\D/g,'');
 if(f.id){Object.assign(byId(f.id),{cpf:d,nome:f.nome.trim(),sobrenome:f.sobrenome.trim(),lider:f.lider,parca:f.parca})}
 else MEMBROS.push({id:'m'+(Date.now()%100000),cpf:d,nome:f.nome.trim(),sobrenome:f.sobrenome.trim(),lider:f.lider,parca:f.parca});
 toast('Membro salvo: '+f.nome.trim()+' '+f.sobrenome.trim());S.screen='membros';render()}
function saveMin(){const f=S.min;f.errors=validateMin(f);
 if(Object.keys(f.errors).length){S.focus=Object.keys(f.errors)[0];render();return}
 if(f.id){Object.assign(MINISTERIOS.find(n=>n.id===f.id),{nome:f.nome.trim(),lider:f.lider})}
 else MINISTERIOS.push({id:'n'+(Date.now()%100000),nome:f.nome.trim(),lider:f.lider});
 toast('Ministério salvo: '+f.nome.trim());S.screen='ministerios';render()}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.hasAttribute('data-bg')&&e.target!==t)return;
 const a=t.dataset.act,id=t.dataset.id;
 switch(a){
  case 'demo':demo(t.dataset.k);break;
  case 'nav':S.modal=null;S.screen=t.dataset.to;render();break;
  case 'logout':S.screen='login';S.login.error=false;render();break;
  case 'new-m':newForm();render();break;
  case 'edit-m':S.modal=null;newForm(id);render();break;
  case 'del-m':{const d=deps(id);S.modal={type:hasDeps(d)?'blocked':'confirm-m',id};render();break}
  case 'new-n':newMin();render();break;
  case 'edit-n':newMin(id);render();break;
  case 'del-n':S.modal={type:'confirm-n',id};render();break;
  case 'filter':S.onlyUnled=t.dataset.v==='unled';render();break;
  case 'close-modal':S.modal=null;render();break;
  case 'confirm-del':{const m=S.modal;S.modal=null;
   if(m.type==='confirm-m'){const x=byId(m.id);MEMBROS.splice(MEMBROS.indexOf(x),1);toast('Membro excluído: '+nome(x))}
   else{const i=MINISTERIOS.findIndex(n=>n.id===m.id);toast('Ministério excluído: '+MINISTERIOS[i].nome);MINISTERIOS.splice(i,1)}
   render();break}
  case 'toggle-pw':S.login.show=!S.login.show;{const i=$('#f-senha');S.login.senha=i.value;render();$('#f-senha').focus()}break;
  case 'combo-clear':{const c=t.closest('.combo');pick(c,null);$('.input',c).focus();break}
  case 'back-m':S.screen='membros';render();break;
  case 'back-n':S.screen='ministerios';render();break;
 }});
document.addEventListener('submit',e=>{e.preventDefault();const k=e.target.dataset.form;
 if(k==='login'){const l=S.login;l.error=!(l.email.includes('@')&&l.senha.length>0)||l.senha==='senhaerrada';if(!l.error){S.screen='membros'}render()}
 else if(k==='membro')saveMember();
 else if(k==='ministerio')saveMin()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.matches('[data-q]')){S.q=t.value;refreshList();return}
 if(t.closest('.combo')){openCombo(t.closest('.combo'),t.value);return}
 const sc=t.dataset.scope;if(!sc)return;const o=scopeObj(sc),f=t.dataset.f;
 if(f==='cpf'){t.value=maskCpf(t.value)}
 o[f]=t.value;
 if(o.errors&&o.errors[f]){delete o.errors[f];setErr(f,'')}
 if(sc==='login'&&o.error){o.error=false;const a=$('[data-login-alert]');if(a)a.remove();$$('.has-error').forEach(x=>x.classList.remove('has-error'))}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches('.combo .input')){const c=t.closest('.combo');if($('.combo-list',c).hidden){t.select();openCombo(c,'')}}});
document.addEventListener('focusout',e=>{const c=e.target.closest&&e.target.closest('.combo');if(c&&!c.contains(e.relatedTarget)){closeCombo(c)}});
document.addEventListener('mousedown',e=>{const li=e.target.closest('.combo-list li[data-id]');if(li){e.preventDefault();pick(li.closest('.combo'),li.dataset.id)}
 else if(e.target.closest('.combo-chev,.combo-clear')&&e.target.closest('.combo')){const c=e.target.closest('.combo');if(e.target.closest('.combo-chev')){e.preventDefault();const i=$('.input',c);if(document.activeElement===i&&!$('.combo-list',c).hidden)closeCombo(c);else{i.focus();if(!$('.combo-list',c).hidden){}else openCombo(c,'')}}}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){S.modal=null;render();return}
 if(e.key==='Escape'&&CFG.drawer&&(S.screen==='membro'||S.screen==='ministerio')&&!$('.combo-list:not([hidden])')){S.screen=S.screen==='membro'?'membros':'ministerios';render();return}
 const t=e.target;if(!t.matches||!t.matches('.combo .input'))return;const c=t.closest('.combo'),l=$('.combo-list',c);
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(l.hidden){openCombo(c,'');return}
  const o=$$('li[data-id]',l);if(!o.length)return;let i=o.findIndex(x=>x.classList.contains('is-act'));i=e.key==='ArrowDown'?Math.min(o.length-1,i+1):Math.max(0,i-1);setActive(c,o[i])}
 else if(e.key==='Enter'){if(!l.hidden){const a=$('li.is-act',l);if(a){e.preventDefault();pick(c,a.dataset.id)}}}
 else if(e.key==='Escape'){if(!l.hidden){e.preventDefault();closeCombo(c)}}});

function start(){render()}

</script>
<script>
CFG={
 tree:false,drawer:true,
 tiers(){const W=560,H=340,ys=[40,130,220,310],xs=n=>Array.from({length:n},(_,i)=>W*(i+.5)/n);
  const t=[xs(1),xs(3),xs(6),xs(12)],par=(i,n,m)=>Math.min(Math.floor(i*n/m),n-1);let L='',D='';
  for(let k=0;k<4;k++){t[k].forEach((x,i)=>{
   if(k>0&&!(k===3&&i===11)){const p=t[k-1][par(i,t[k-1].length,t[k].length)];L+=`<path d="M${p} ${ys[k-1]}C${p} ${(ys[k-1]+ys[k])/2} ${x} ${(ys[k-1]+ys[k])/2} ${x} ${ys[k]}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>`}
   const flag=k===3&&i===11;D+=`<circle cx="${x}" cy="${ys[k]}" r="${[11,9,7.5,6][k]}" fill="${flag?'#F0775A':'rgba(255,255,255,'+[.95,.85,.7,.55][k]+')'}"/>`})}
  return `<svg class="tiers" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rede de cuidado em camadas: cada pessoa cuida de algumas, e uma delas está sem líder">${L}${D}</svg>`},
 login(){const l=S.login,bad=l.error;return `<main class="login">
  <section class="lpanel"><div class="brand"><span class="mk">${MARK()}</span><b>JETRO</b></div>${CFG.tiers()}
   <p class="lverse">Põe-nos sobre eles por maiorais de mil, maiorais de cem, maiorais de cinquenta e maiorais de dez.<cite>Êxodo 18:21</cite></p></section>
  <section class="lright"><form class="lform" data-form="login" novalidate>
   <div><h1>Entrar</h1></div><p class="lead">Acesso para a equipe e os líderes da Oitava Igreja Presbiteriana de Belo Horizonte.</p>
   ${bad?`<div class="alert" role="alert" data-login-alert>${icon('alert')}<span>Email ou senha inválidos</span></div>`:''}
   ${F.text({f:'email',scope:'login',label:'Email',value:l.email,type:'email',ac:'username',left:'mail',invalid:bad,ph:'nome@exemplo.com.br'})}
   ${F.pw({invalid:bad})}
   <button class="btn btn-primary" type="submit">Entrar</button>
  </form></section></main>`},
 shell(inner,active){const L=[['membros','Membros','users'],['ministerios','Ministérios','heart']];
  return `<div class="shell"><aside class="side"><div class="brand"><span class="mk">${MARK()}</span><b>JETRO</b></div>
   <nav class="nav" aria-label="Principal">${L.map(x=>`<a href="#" data-act="nav" data-to="${x[0]}"${x[0]===active?' aria-current="page"':''}>${icon(x[2])}<span class="txt">${x[1]}</span></a>`).join('')}</nav>
   <div class="me"><div class="p"><span class="av av-lg">${USER.nome.split(' ').map(p=>p[0]).join('')}</span><div class="pt"><b>${USER.nome}</b><small>${USER.papel}</small></div></div>
    <button type="button" class="btn btn-outline" data-act="logout">${icon('logout',18)}<span class="txt">Sair</span></button></div></aside>
   <main class="main">${inner}</main></div>`},
 membros(){const n=unled().length;
  return `<header class="head"><div><h1>Membros</h1><p class="sub">Veja quem lidera quem e quem ainda está sem líder.</p></div>
   <button class="btn btn-primary" data-act="new-m">${icon('plus',20)}Novo membro</button></header>
   <div class="bar"><div class="chips" role="group" aria-label="Filtro"><button class="chip" data-act="filter" data-v="all" aria-pressed="${!S.onlyUnled}">Todos <small>${MEMBROS.length}</small></button><button class="chip coral" data-act="filter" data-v="unled" aria-pressed="${S.onlyUnled}">Sem líder <small>${n}</small></button></div>
    <div class="inwrap search"><span class="in-left">${icon('search',20)}</span><input class="input has-left" data-q type="search" placeholder="Buscar nome ou CPF" aria-label="Buscar membro" value="${esc(S.q)}"></div></div>
   <div class="card" id="tbl">${CFG.table(visible())}</div>`},
 table(items){if(!items.length)return `<p class="empty-row">Nenhum membro encontrado.</p>`;
  const pc=id=>{const x=byId(id);return x?`<span class="pill">${F.av(x,'av-sm')}${esc(nome(x))}</span>`:null};
  return `<table class="tbl"><thead><tr><th scope="col">Nome completo</th><th scope="col">CPF</th><th scope="col">Líder</th><th scope="col">Parça</th><th scope="col"><span class="sr-only">Ações</span></th></tr></thead><tbody>`+
  items.map(({m})=>{const k=nLed(m);return `<tr class="${m.lider?'':'is-unled'}"><td><div class="who">${F.av(m,'av-md')}<div class="t"><b>${esc(nome(m))}</b>${k?`<small>Lidera ${k} ${k>1?'pessoas':'pessoa'}</small>`:''}</div></div></td>
   <td class="cpf">${maskCpf(m.cpf)}</td>
   <td>${pc(m.lider)||`<div class="flagc"><span class="flag">${icon('alert')}Sem líder</span><button class="btn btn-subtle pick" data-act="edit-m" data-id="${m.id}">Escolher líder</button></div>`}</td>
   <td>${pc(m.parca)||'<span class="dash" aria-hidden="true">—</span><span class="sr-only">Sem parça</span>'}</td>
   <td class="acts"><button class="aicon" data-act="edit-m" data-id="${m.id}" aria-label="Editar ${esc(nome(m))}" title="Editar">${icon('edit')}</button><button class="aicon danger" data-act="del-m" data-id="${m.id}" aria-label="Excluir ${esc(nome(m))}" title="Excluir">${icon('trash')}</button></td></tr>`}).join('')+`</tbody></table>`},
 drawer(title,sub,body,foot,formKey,back){return `<div class="overlay drawer" data-act="${back}" data-bg><form class="dpanel" data-form="${formKey}" role="dialog" aria-modal="true" aria-labelledby="dt" novalidate>
   <div class="dhead"><div><h2 id="dt">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="aicon" data-act="${back}" aria-label="Fechar">${icon('x')}</button></div>
   <div class="dbody">${body}</div><div class="dfoot">${foot}</div></form></div>`},
 membro(){const f=S.form,e=f.errors,ed=!!f.id;
  return CFG.membros()+CFG.drawer(ed?'Editar membro':'Novo membro',ed?esc(nome(byId(f.id))):'',
   `${F.text({f:'cpf',scope:'form',label:'CPF',required:1,value:f.cpf,error:e.cpf,ph:'000.000.000-00',inputmode:'numeric'})}
    <div class="row2">${F.text({f:'nome',scope:'form',label:'Nome',required:1,value:f.nome,error:e.nome,ac:'given-name'})}${F.text({f:'sobrenome',scope:'form',label:'Sobrenome',required:1,value:f.sobrenome,error:e.sobrenome,ac:'family-name'})}</div>
    <div class="group"><h3>Quem cuida desta pessoa</h3>${F.combo({f:'lider',scope:'form',label:'Líder',value:f.lider,error:e.lider,desc:HELP.lider})}${F.combo({f:'parca',scope:'form',label:'Parça',value:f.parca,error:e.parca,desc:HELP.parca})}</div>`,
   `<button class="btn btn-outline" type="button" data-act="back-m">Cancelar</button><button class="btn btn-primary" type="submit">Salvar membro</button>`,'membro','back-m')},
 ministerios(){return `<header class="head"><div><h1>Ministérios</h1><p class="sub">Cada ministério tem um membro como líder.</p></div><button class="btn btn-primary" data-act="new-n">${icon('plus',20)}Novo ministério</button></header>
  <div class="card"><table class="tbl"><thead><tr><th scope="col">Nome</th><th scope="col">Líder</th><th scope="col"><span class="sr-only">Ações</span></th></tr></thead><tbody>`+
  MINISTERIOS.map(n=>{const l=byId(n.lider);return `<tr><td><div class="who"><span class="minic">${icon('heart')}</span><div class="t"><b>${esc(n.nome)}</b></div></div></td><td><span class="pill">${F.av(l,'av-sm')}${esc(nome(l))}</span></td><td class="acts"><button class="aicon" data-act="edit-n" data-id="${n.id}" aria-label="Editar ${esc(n.nome)}" title="Editar">${icon('edit')}</button><button class="aicon danger" data-act="del-n" data-id="${n.id}" aria-label="Excluir ${esc(n.nome)}" title="Excluir">${icon('trash')}</button></td></tr>`}).join('')+`</tbody></table></div>`},
 ministerio(){const f=S.min,e=f.errors;
  return CFG.ministerios()+CFG.drawer(f.id?'Editar ministério':'Novo ministério','',
   `${F.text({f:'nome',scope:'min',label:'Nome',required:1,value:f.nome,error:e.nome,ph:'Ex.: Louvor'})}${F.combo({f:'lider',scope:'min',label:'Líder',required:1,value:f.lider,error:e.lider,desc:'Escolha entre os membros cadastrados.'})}`,
   `<button class="btn btn-outline" type="button" data-act="back-n">Cancelar</button><button class="btn btn-primary" type="submit">Salvar ministério</button>`,'ministerio','back-n')},
 blockedModal(m,d,msg){
  const g=(t,items)=>items.length?`<div><h3>${t}</h3><div class="cl">${items.join('')}</div></div>`:'';
  return `<div class="overlay" data-act="close-modal" data-bg><div class="modal block" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mb">
   <div class="block-ic">${icon('warn')}</div><h2 class="modal-title" id="mt">Exclusão bloqueada</h2><p class="modal-body" id="mb">${esc(msg)}</p>
   <div class="deps">
    ${g('Líder de',d.lidera.map(x=>`<button class="pill" data-act="edit-m" data-id="${x.id}">${F.av(x,'av-sm')}${esc(nome(x))}</button>`))}
    ${g('Parça de',d.parca.map(x=>`<button class="pill" data-act="edit-m" data-id="${x.id}">${F.av(x,'av-sm')}${esc(nome(x))}</button>`))}
    ${g(d.min.length>1?'Líder dos ministérios':'Líder do ministério',d.min.map(x=>`<button class="pill min" data-act="edit-n" data-id="${x.id}">${esc(x.nome)}</button>`))}
    <p class="hint">Clique num nome para abrir o cadastro e trocar o vínculo.</p></div>
   <div class="modal-actions"><button class="btn btn-primary" data-act="close-modal" data-autofocus>Entendi</button></div></div></div>`}
};
start();

</script></body></html>
