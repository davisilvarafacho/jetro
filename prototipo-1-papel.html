<!doctype html>
<!-- Direção "Papel": sidebar fixa em papel creme com serifa Fraunces nos títulos + Source Sans 3 no corpo, bordô como única cor de ação, ocre para quem está sem líder; arejado, tipografia editorial, tudo mapeável em theme/AppShell/Table/Modal do Mantine. -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JETRO · Papel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* base compartilhada: equivale ao que o Mantine entrega por componente; cada protótipo muda só os tokens e o acabamento */
*{box-sizing:border-box}
:root{--demo-space:64px}
html,body{margin:0}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mark{flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* campos */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-weight:600;font-size:var(--lbl-size,.875rem);line-height:1.3}
.req{color:var(--danger)}
.desc{color:var(--muted);font-size:.8125rem;line-height:1.45;max-width:62ch}
.inwrap{position:relative}
.input{display:block;width:100%;height:var(--input-h,40px);padding:0 12px;border:1px solid var(--input-line,var(--line));border-radius:var(--r-sm);background:var(--input-bg,#fff);font-size:var(--input-size,1rem);transition:border-color .12s,box-shadow .12s}
.input::placeholder{color:var(--placeholder,#9a9a9a)}
.input:hover{border-color:var(--input-line-hover,var(--input-line,var(--line)))}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.input[data-mono]{font-family:var(--font-mono);letter-spacing:.01em}
.input.has-left{padding-left:38px}
.input.has-right{padding-right:40px}
.in-left{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.in-right-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);display:grid;place-items:center}
.in-right-btn:hover{background:var(--hover);color:var(--ink)}
.has-error .input{border-color:var(--danger);background:var(--input-bg-err,#fff)}
.has-error .input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.err{color:var(--danger);font-size:.8125rem;line-height:1.4;font-weight:500}
.err:empty{display:none}

/* select pesquisável */
.combo{position:relative}
.combo .input{padding-right:62px}
.combo-chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.combo-clear{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);display:grid;place-items:center}
.combo-clear:hover{background:var(--hover);color:var(--ink)}
.combo:not(.has-val) .combo-clear{display:none}
.combo-list{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;max-height:248px;overflow:auto;margin:0;padding:4px;list-style:none;background:var(--pop-bg,#fff);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 10px 30px -8px rgba(0,0,0,.22)}
.combo-list[hidden]{display:none}
.combo-list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:calc(var(--r-sm) - 1px);cursor:pointer;font-size:var(--opt-size,.9375rem)}
.combo-list li .opt-name{flex:1}
.combo-list li.is-act{background:var(--hover)}
.combo-list li[aria-selected="true"]{font-weight:600;color:var(--primary)}
.combo-list li.empty{cursor:default;color:var(--muted);justify-content:center;padding:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--btn-h,40px);padding:0 var(--btn-px,16px);border-radius:var(--r-btn,var(--r-sm));border:1px solid transparent;font-weight:600;font-size:var(--btn-size,.9375rem);line-height:1;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink,#fff)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:transparent;border-color:var(--btn-line,var(--line));color:var(--ink)}
.btn-outline:hover{background:var(--hover)}
.btn-subtle{background:transparent;color:var(--primary)}
.btn-subtle:hover{background:var(--hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.aicon{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--r-sm);color:var(--muted);transition:background .12s,color .12s}
.aicon:hover{background:var(--hover);color:var(--ink)}
.aicon.danger:hover{background:var(--danger-bg);color:var(--danger)}
.aicon .i{width:18px;height:18px}

/* avatar, modal, aviso */
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--av-bg);color:var(--av-ink);font-weight:600;letter-spacing:.02em}
.av-xs{width:22px;height:22px;font-size:.625rem}
.av-sm{width:26px;height:26px;font-size:.6875rem}
.av-md{width:34px;height:34px;font-size:.8125rem}
.av-lg{width:44px;height:44px;font-size:1rem}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--overlay,rgba(20,20,20,.45));animation:fade .15s ease-out}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(100%,var(--modal-w,460px));max-height:calc(100vh - 48px);overflow:auto;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);animation:rise .18s ease-out}
.modal-title{font-family:var(--font-head);font-size:1.25rem;font-weight:var(--head-w,600);line-height:1.25}
.modal-body{margin-top:10px;color:var(--ink-2,var(--ink));line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.toast{position:fixed;top:var(--toast-top,16px);right:16px;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok,#2f9e44);border-radius:var(--r-md);box-shadow:0 10px 30px -8px rgba(0,0,0,.25);font-weight:500;font-size:.9375rem;animation:rise .2s ease-out}
.toast .i{color:var(--ok,#2f9e44);width:18px;height:18px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* barra de telas do protótipo (não faz parte do produto) */
#demo{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:12px;z-index:70;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:calc(100vw - 24px);padding:4px;background:#1b1b1d;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);font:500 12px/1 system-ui,sans-serif}
#demo span{color:#8d8d92;padding:8px 8px 8px 10px;align-self:center}
#demo button{border:0;background:transparent;color:#d4d4d8;padding:8px 10px;border-radius:7px;font:inherit}
#demo button:hover{background:#34343a}
#demo button[aria-current]{background:#f4f4f5;color:#111}

:root{
 --font-body:'Source Sans 3',system-ui,sans-serif;--font-head:'Fraunces',Georgia,serif;--font-mono:ui-monospace,monospace;
 --bg:#F5F0E6;--surface:#FCFAF5;--ink:#2B221D;--ink-2:#4A3F37;--muted:#6B6054;--line:#E0D5C2;--hover:#EEE6D6;
 --primary:#7A2C3B;--primary-hover:#621F2D;--focus:#7A2C3B;--danger:#B3261E;--danger-bg:#FBEAE7;
 --flag-bg:#FAF0D2;--flag-line:#D9A63F;--flag-ink:#6B4A00;--ok:#4C7A3A;
 --r-sm:6px;--r-md:8px;--r-lg:12px;--input-h:44px;--btn-h:42px;--input-line:#CDBFA8;--input-line-hover:#B3A388;--placeholder:#9B8F80;
 --av-bg:#E8DAC3;--av-ink:#5A4630;--head-w:500;--toast-top:20px;--overlay:rgba(43,34,29,.5)
}
body{font-size:17px}
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 16px 20px;background:#EDE4D3;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--primary)}
.brand .mark{width:30px;height:30px}
.brand b{font-family:var(--font-head);font-weight:600;font-size:1.65rem;letter-spacing:.05em;color:var(--ink)}
.brand-sub{padding:8px 10px 0 50px;font-size:.8125rem;line-height:1.35;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:36px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500;border:1px solid transparent;transition:background .12s}
.nav a .i{width:20px;height:20px;color:var(--muted)}
.nav a:hover{background:rgba(255,255,255,.55)}
.nav a[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--primary);font-weight:600}
.nav a[aria-current="page"] .i{color:var(--primary)}
.me{margin-top:auto;padding:14px 10px 0;border-top:1px solid #D9CEB9;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.me .av{grid-row:span 2}
.me b{font-weight:600;font-size:.9375rem;line-height:1.2}
.me small{color:var(--muted);font-size:.8125rem;line-height:1.2}
.me button{grid-column:1/-1;margin-top:12px;justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:6px 8px;margin-left:-8px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;font-size:.9375rem}
.me button:hover{background:rgba(255,255,255,.55);color:var(--primary)}
.me button .i{width:18px;height:18px}
.main{min-width:0;padding:48px 56px 120px}
.page{max-width:1080px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-head);font-weight:500;font-size:2.4rem;line-height:1.1;letter-spacing:-.01em}
.sub{margin-top:8px;color:var(--muted);font-size:1.0625rem}
.sub b{color:var(--ink);font-weight:600}
.notice{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:24px;background:var(--flag-bg);border:1px solid #E6CB86;border-left:4px solid var(--flag-line);border-radius:var(--r-md);color:var(--flag-ink)}
.notice .i{width:22px;height:22px;flex:none}
.notice p{flex:1;line-height:1.4}
.notice .btn{color:var(--flag-ink);height:36px}
.notice .btn:hover{background:rgba(217,166,63,.2)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.search{width:340px}
.chips{display:flex;gap:8px}
.chip{height:36px;padding:0 14px;border:1px solid var(--input-line);background:transparent;border-radius:999px;font-weight:500;font-size:.9375rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:background .12s}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-size:.8125rem;opacity:.75;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl th{padding:14px 16px;font-size:.8125rem;color:var(--muted);background:#F3ECDD;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:14px 16px;border-bottom:1px solid #EAE1D0;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:not(.is-unled):hover{background:#F6F0E3}
.tbl .nm{font-weight:600;line-height:1.25}
.tbl .nm-sub{font-size:.875rem;color:var(--muted);margin-top:2px}
.tbl .cpf{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.tbl .acts{text-align:right;white-space:nowrap;width:1%}
.pcell{display:inline-flex;align-items:center;gap:10px}
.dash{color:#A99C8B}
.tbl tr.is-unled td{background:var(--flag-bg)}
.tbl tr.is-unled td:first-child{box-shadow:inset 4px 0 0 var(--flag-line)}
.tbl tr.is-unled:hover td{background:#F7E8BC}
.flag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 9px;background:#EFCB75;color:#4F3600;border-radius:999px;font-weight:600;font-size:.875rem}
.flag .i{width:16px;height:16px}
.tfoot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem;background:#F3ECDD}
.empty-row{padding:48px 16px;text-align:center;color:var(--muted)}
.link-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;padding:4px 8px 4px 0;border:0;background:transparent;color:var(--ink-2);font-weight:500;font-size:.9375rem}
.link-back:hover{color:var(--primary)}
.link-back .i{width:18px;height:18px}
.formgrid{display:grid;grid-template-columns:minmax(0,600px) minmax(0,320px);gap:40px;align-items:start}
.form{padding:32px;display:grid;gap:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form .cpf-f{max-width:260px}
.legend{margin-top:6px;padding-top:26px;border-top:1px solid var(--line);font-family:var(--font-head);font-size:1.25rem;font-weight:500}
.form-actions{display:flex;gap:10px;padding-top:6px}
.aside{padding:4px 0}
.aside h2{font-family:var(--font-head);font-weight:500;font-size:1.25rem}
.aside dl{margin:16px 0 0;display:grid;gap:18px}
.aside dt{font-weight:600}
.aside dd{margin:2px 0 0;color:var(--ink-2);line-height:1.5}
.aside .rule{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9375rem}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:40px 20px 100px;background:var(--bg)}
.login-in{width:100%;max-width:420px}
.login .brand{justify-content:center;margin-bottom:6px}
.login .brand-sub{padding:0;text-align:center;margin-bottom:28px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;display:grid;gap:20px;box-shadow:0 1px 0 #fff inset,0 18px 40px -24px rgba(43,34,29,.35)}
.login-card h1{font-size:1.75rem}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--danger-bg);border:1px solid #F0C4BE;color:#8C1D17;font-weight:500;line-height:1.35}
.alert .i{width:20px;height:20px;margin-top:1px}
.login-card .btn{width:100%;height:46px;font-size:1rem}
.verse{margin:28px 8px 0;text-align:center;font-family:var(--font-head);font-style:italic;font-weight:400;font-size:1rem;line-height:1.55;color:var(--ink-2)}
.verse cite{display:block;margin-top:8px;font-style:normal;font-family:var(--font-body);font-size:.8125rem;color:var(--muted);letter-spacing:.02em}
/* modal bloqueio */
.modal.block{--modal-w:540px;padding:0;overflow:hidden}
.block-head{display:flex;gap:16px;padding:28px 28px 0}
.block-ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--flag-bg);border:1px solid #E6CB86;color:#8A5A00;display:grid;place-items:center}
.block-ic .i{width:22px;height:22px}
.block-head .modal-title{font-size:1.5rem}
.block-head .modal-body{margin-top:8px}
.deps{margin:22px 28px 0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.deps h3{padding:9px 14px;background:#F3ECDD;border-bottom:1px solid var(--line);font-size:.8125rem;font-weight:600;color:var(--muted)}
.deps section+section h3{border-top:1px solid var(--line)}
.deps li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid #EAE1D0}
.deps section:last-child li:last-child{border-bottom:0}
.deps ul{list-style:none;margin:0;padding:0}
.deps li span.n{flex:1;font-weight:500}
.deps li .btn{height:32px;font-size:.875rem}
.block-actions{display:flex;justify-content:flex-end;padding:22px 28px 28px}
@media (max-width:1100px){.main{padding:36px 32px 120px}.shell{grid-template-columns:232px 1fr}.formgrid{grid-template-columns:1fr}.search{width:280px}}
.card.form{overflow:visible}

<script>
/* ===== dados fictícios ===== */
const MEMBROS=[

 {id:'m10',nome:'Tiago',sobrenome:'Ribeiro',cpf:'68077357407',lider:'m8',parca:null},

];

 {id:'n2',nome:'Diaconia',lider:'m3'},
 {id:'n3',nome:'Escola Dominical',lider:'m13'},
 {id:'n4',nome:'Jovens',lider:'m8'}
];

const FEM=new Set(['m3','m4','m7','m9','m11','m13']);

/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>MEMBROS.find(m=>m.id===id)||null;

const ini=m=>m?(m.nome[0]+m.sobrenome[0]).toUpperCase():'';
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cmp=(a,b)=>nome(a).localeCompare(nome(b),'pt-BR');
const maskCpf=v=>String(v).replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
function cpfOk(v){const d=String(v).replace(/\D/g,'');if(d.length!==11||/^(\d)\1+$/.test(d))return false;
 for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=d[i]*(t+1-i);if((s*10)%11%10!=d[t])return false}return true}

 return 'Não é possível excluir '+nome(m)+': '+(FEM.has(m.id)?'ela':'ele')+' é '+listPt(p)+'. Troque esses vínculos antes de excluir.'}

function newForm(id){const m=id?byId(id):null;
 S.form={id:id||null,cpf:m?maskCpf(m.cpf):'',nome:m?m.nome:'',sobrenome:m?m.sobrenome:'',lider:m?m.lider:null,parca:m?m.parca:null,errors:{}};S.screen='membro'}

function validateMember(f){const e={},d=f.cpf.replace(/\D/g,'');
 if(!d)e.cpf='Informe o CPF';
 else if(!cpfOk(d))e.cpf='CPF inválido';
 else if(MEMBROS.some(m=>m.cpf===d&&m.id!==f.id))e.cpf='Este CPF já está cadastrado';
 if(!f.nome.trim())e.nome='Informe o nome';
 if(!f.sobrenome.trim())e.sobrenome='Informe o sobrenome';
 if(f.id&&f.lider===f.id)e.lider='Um membro não pode ser líder de si mesmo';

 else if(k==='bloqueado'){S.screen='membros';S.q='';S.onlyUnled=false;S.modal={type:'blocked',id:'m2'}}

 render()}

/* ===== listas ===== */
function treeOrder(){const out=[];
 const kids=id=>MEMBROS.filter(m=>m.lider===id).sort(cmp);
 const size=m=>1+kids(m.id).reduce((a,k)=>a+size(k),0);
 const walk=(m,d)=>{out.push({m,d});kids(m.id).forEach(k=>walk(k,d+1))};
 MEMBROS.filter(m=>!m.lider).sort((a,b)=>size(b)-size(a)||cmp(a,b)).forEach(r=>walk(r,0));return out}
function visible(){let items=CFG.tree?treeOrder():MEMBROS.slice().sort(cmp).map(m=>({m,d:0}));
 const q=norm(S.q).trim(),qd=S.q.replace(/\D/g,'');
 if(S.onlyUnled)items=items.filter(i=>!i.m.lider);
 if(q)items=items.filter(i=>norm(nome(i.m)).includes(q)||(qd&&i.m.cpf.includes(qd)));
 return items}

function setErr(f,msg){const w=$(`[data-field="${f}"]`);if(!w)return;
 w.classList.toggle('has-error',!!msg);const e=$('.err',w);if(e)e.textContent=msg||'';
 const i=$('.input',w);if(i){if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}}

function optionsHtml(c,q){const f=c.dataset.combo,sel=scopeObj(c.dataset.scope)[f];const nq=norm(q||'');
 const items=MEMBROS.slice().sort(cmp).filter(m=>!nq||norm(nome(m)).includes(nq));
 return items.length?items.map(m=>`<li role="option" id="o-${f}-${m.id}" data-id="${m.id}" aria-selected="${m.id===sel}">${F.av(m,'av-sm')}<span class="opt-name">${esc(nome(m))}</span>${m.id===sel?icon('check',16):''}</li>`).join(''):'<li class="empty" aria-disabled="true">Nenhum membro encontrado</li>'}

function closeCombo(c){const l=$('.combo-list',c),i=$('.input',c);l.hidden=true;i.setAttribute('aria-expanded','false');i.removeAttribute('aria-activedescendant');
 const id=scopeObj(c.dataset.scope)[c.dataset.combo];i.value=id?nome(byId(id)):''}
function setActive(c,li){$$('li.is-act',c).forEach(x=>x.classList.remove('is-act'));if(!li)return;li.classList.add('is-act');
 $('.input',c).setAttribute('aria-activedescendant',li.id);li.scrollIntoView({block:'nearest'})}
function pick(c,id){const f=c.dataset.combo,sc=c.dataset.scope,o=scopeObj(sc);o[f]=id||null;c.classList.toggle('has-val',!!id);
 $('.input',c).value=id?nome(byId(id)):'';closeCombo(c);
 let msg='';if(sc==='form'&&id&&id===S.form.id)msg=f==='lider'?'Um membro não pode ser líder de si mesmo':'Um membro não pode ser parça de si mesmo';
 if(msg)o.errors[f]=msg;else delete o.errors[f];setErr(f,msg)}

function modalHtml(){const m=S.modal;if(!m)return '';

 return ''}

function saveMember(){const f=S.form;f.errors=validateMember(f);
 if(Object.keys(f.errors).length){S.focus=Object.keys(f.errors)[0];render();return}
 const d=f.cpf.replace(/\D/g,'');

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.hasAttribute('data-bg')&&e.target!==t)return;

  case 'new-n':newMin();render();break;
  case 'edit-n':newMin(id);render();break;
  case 'del-n':S.modal={type:'confirm-n',id};render();break;

  case 'confirm-del':{const m=S.modal;S.modal=null;

  case 'toggle-pw':S.login.show=!S.login.show;{const i=$('#f-senha');S.login.senha=i.value;render();$('#f-senha').focus()}break;
  case 'combo-clear':{const c=t.closest('.combo');pick(c,null);$('.input',c).focus();break}

 }});

 const t=e.target;if(!t.matches||!t.matches('.combo .input'))return;const c=t.closest('.combo'),l=$('.combo-list',c);
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(l.hidden){openCombo(c,'');return}
  const o=$$('li[data-id]',l);if(!o.length)return;let i=o.findIndex(x=>x.classList.contains('is-act'));i=e.key==='ArrowDown'?Math.min(o.length-1,i+1):Math.max(0,i-1);setActive(c,o[i])}
 else if(e.key==='Enter'){if(!l.hidden){const a=$('li.is-act',l);if(a){e.preventDefault();pick(c,a.dataset.id)}}}
 else if(e.key==='Escape'){if(!l.hidden){e.preventDefault();closeCombo(c)}}});

function start(){render()}

</script>

CFG={

 </div></main>`},

  </aside><main class="main">${inner}</main></div>`},
 membros(){const n=unled().length;

   ${n?`<div class="notice" role="note">${icon('warn')}<p><b>${n} ${n>1?'membros ainda não têm':'membro ainda não tem'} líder.</b> Ninguém acompanha ${n>1?'essas pessoas':'essa pessoa'} hoje.</p><button class="btn btn-subtle" data-act="filter" data-v="unled">Ver quem são</button></div>`:''}
   <div class="toolbar"><div class="inwrap search"><span class="in-left">${icon('search',18)}</span><input class="input has-left" data-q type="search" placeholder="Buscar por nome ou CPF" aria-label="Buscar membro" value="${esc(S.q)}"></div>
    <div class="chips" role="group" aria-label="Filtro"><button class="chip" data-act="filter" data-v="all" aria-pressed="${!S.onlyUnled}">Todos <small>${MEMBROS.length}</small></button><button class="chip" data-act="filter" data-v="unled" aria-pressed="${S.onlyUnled}">Sem líder <small>${n}</small></button></div></div>
   <div class="card" id="tbl">${CFG.table(visible())}</div></div>`},
 table(items){if(!items.length)return `<p class="empty-row">Nenhum membro encontrado.</p>`;
  const pc=id=>{const x=byId(id);return x?`<span class="pcell">${F.av(x,'av-xs')}${esc(nome(x))}</span>`:null};
  return `<table class="tbl"><thead><tr><th scope="col">Nome completo</th><th scope="col">CPF</th><th scope="col">Líder</th><th scope="col">Parça</th><th scope="col"><span class="sr-only">Ações</span></th></tr></thead><tbody>`+
  items.map(({m})=>{const k=nLed(m);return `<tr class="${m.lider?'':'is-unled'}"><td><div class="nm">${esc(nome(m))}</div>${k?`<div class="nm-sub">Lidera ${k} ${k>1?'pessoas':'pessoa'}</div>`:''}</td>
   <td class="cpf">${maskCpf(m.cpf)}</td>
   <td>${pc(m.lider)||`<span class="flag">${icon('alert')}Sem líder</span>`}</td>
   <td>${pc(m.parca)||'<span class="dash" aria-hidden="true">—</span><span class="sr-only">Sem parça</span>'}</td>
   <td class="acts"><button class="aicon" data-act="edit-m" data-id="${m.id}" aria-label="Editar ${esc(nome(m))}" title="Editar">${icon('edit')}</button><button class="aicon danger" data-act="del-m" data-id="${m.id}" aria-label="Excluir ${esc(nome(m))}" title="Excluir">${icon('trash')}</button></td></tr>`}).join('')+
  `</tbody></table><p class="tfoot">Mostrando ${items.length} de ${MEMBROS.length} membros</p>`},
 membro(){const f=S.form,e=f.errors,ed=!!f.id;
  return `<div class="page"><button class="link-back" data-act="back-m">${icon('back')}Membros</button>
   <header class="page-head"><div><h1>${ed?'Editar membro':'Novo membro'}</h1>${ed?`<p class="sub">${esc(nome(byId(f.id)))}</p>`:''}</div></header>
   <div class="formgrid"><form class="card form" data-form="membro" novalidate>
    <div class="cpf-f">${F.text({f:'cpf',scope:'form',label:'CPF',required:1,value:f.cpf,error:e.cpf,ph:'000.000.000-00',inputmode:'numeric'})}</div>
    <div class="row2">${F.text({f:'nome',scope:'form',label:'Nome',required:1,value:f.nome,error:e.nome,ac:'given-name'})}${F.text({f:'sobrenome',scope:'form',label:'Sobrenome',required:1,value:f.sobrenome,error:e.sobrenome,ac:'family-name'})}</div>
    <h2 class="legend">Quem cuida desta pessoa</h2>
    ${F.combo({f:'lider',scope:'form',label:'Líder',value:f.lider,error:e.lider,desc:HELP.lider})}
    ${F.combo({f:'parca',scope:'form',label:'Parça',value:f.parca,error:e.parca,desc:HELP.parca})}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Salvar membro</button><button class="btn btn-outline" type="button" data-act="back-m">Cancelar</button></div>

 ministerios(){return `<div class="page"><header class="page-head"><div><h1>Ministérios</h1><p class="sub"><b>${MINISTERIOS.length}</b> ministérios</p></div><button class="btn btn-primary" data-act="new-n">${icon('plus',18)}Novo ministério</button></header>

  MINISTERIOS.map(n=>{const l=byId(n.lider);return `<tr><td class="nm">${esc(n.nome)}</td><td><span class="pcell">${F.av(l,'av-xs')}${esc(nome(l))}</span></td><td class="acts"><button class="aicon" data-act="edit-n" data-id="${n.id}" aria-label="Editar ${esc(n.nome)}" title="Editar">${icon('edit')}</button><button class="aicon danger" data-act="del-n" data-id="${n.id}" aria-label="Excluir ${esc(n.nome)}" title="Excluir">${icon('trash')}</button></td></tr>`}).join('')+`</tbody></table></div></div>`},
 ministerio(){const f=S.min,e=f.errors;
  return `<div class="page"><button class="link-back" data-act="back-n">${icon('back')}Ministérios</button>

    ${F.combo({f:'lider',scope:'min',label:'Líder',required:1,value:f.lider,error:e.lider,desc:'Precisa ser um membro cadastrado.'})}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Salvar ministério</button><button class="btn btn-outline" type="button" data-act="back-n">Cancelar</button></div>
   </form><aside class="aside"><h2>Quem lidera</h2><p class="rule" style="border:0;margin:12px 0 0;padding:0">O líder do ministério também cuida de pessoas. Se ele ficar sem líder, aparece destacado na lista de membros.</p></aside></div></div>`},
 blockedModal(m,d,msg){
  const row=(x,act,id,lbl)=>`<li>${x.av||''}<span class="n">${esc(x.t)}</span><button class="btn btn-subtle" data-act="${act}" data-id="${id}">${lbl}</button></li>`;
  const sec=(t,items)=>items.length?`<section><h3>${t}</h3><ul>${items.join('')}</ul></section>`:'';

};
